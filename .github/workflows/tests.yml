name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  source-tracking:
    name: Source tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for ignored sources
        run: bash scripts/check-ignored-sources.sh

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install "ruff==0.16.7"
      - name: Check formatting
        run: ruff format --check src/ tests/

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install "ruff==0.16.7"
      - name: Run ruff
        run: ruff check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run mypy
        run: mypy src/
      - name: Compile sources
        run: python -m compileall -q src/

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # upload-artifact posts to the Actions API and needs actions: write;
    # grant it only here so every other job stays least-privilege.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run pytest (coverage gate)
        run: pytest --cov=gate --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -q
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        # pip-audit -r only accepts requirements files; the project-path form
        # (pip-audit .) reads the declared dependencies from pyproject.toml.
        run: pip-audit .

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [source-tracking, format, lint, typecheck, test, security, pre-commit]
    # The buildx GHA cache exporter (cache-to: type=gha) writes via the
    # GitHub Cache API and needs actions: write; grant it only here so
    # every other job stays least-privilege (contents: read).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: vllm-gate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          ignore-error: true
