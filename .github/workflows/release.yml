name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Gate: a v* tag is only released if the project checks pass first.
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check src/ tests/
      - name: Run ruff
        run: ruff check .
      - name: Run mypy
        run: mypy src/
      - name: Run pytest (coverage gate)
        run: pytest --cov=gate --cov-fail-under=80 -q

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            IS_TAG=true
            VERSION=$version
            if [[ "$version" == *-* ]]; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi
          else
            IS_TAG=false
            VERSION=
            IS_PRERELEASE=false
          fi
          {
            echo "IS_TAG=$IS_TAG"
            echo "VERSION=$VERSION"
            echo "IS_PRERELEASE=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }},enable=${{ steps.version.outputs.IS_TAG == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.IS_TAG == 'false' || steps.version.outputs.IS_PRERELEASE == 'false' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Create GitHub Release
        if: steps.version.outputs.IS_TAG == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          draft: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
