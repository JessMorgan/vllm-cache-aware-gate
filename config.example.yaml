# Gate configuration — reference example.
#
# The gate reads /etc/gate/config.yaml by default; mount this file there (or
# pass an explicit path to load_config). All keys are optional; defaults fill
# any that are absent. The only hard requirement is at least one thresholds
# entry.
#
# NOTE: kv_pct is a percentage (0-100). The vLLM metric is a fraction (0-1);
# the gate multiplies it by 100 before comparing.
vllm_host: vllm
vllm_port: 8000
listen_host: 0.0.0.0
listen_port: 8000
metrics_poll_interval_s: 2.0
stale_after_s: 6.0
chars_per_token: 4
default_max_tokens: 256

# Tiered policy, highest tier only: when usage crosses several thresholds the
# one with the largest kv_pct governs.
thresholds:
  - kv_pct: 50
    max_context: 4096
    timeout_s: 15
  - kv_pct: 80
    max_context: 1024
    timeout_s: 30
