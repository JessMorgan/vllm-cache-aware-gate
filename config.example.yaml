# Gate configuration — reference example.
#
# The gate reads /etc/gate/config.yaml by default; mount this file there (or
# pass an explicit path to load_config). Most keys are optional with sane
# defaults — EXCEPT `backends`, which is REQUIRED: the gate has no other way
# to learn its upstream, so at least one backend (name + host + port) must
# always be configured (file key `backends` or the BACKENDS_JSON env var).
#
# NOTE: kv_pct is a percentage (0-100). The vLLM metric is a fraction (0-1);
# the gate multiplies it by 100 before comparing.
#
# The legacy vllm_host/vllm_port keys (and the VLLM_HOST/VLLM_PORT env vars)
# are REMOVED: a config containing them fails with a migration-hint error.

# Backends — REQUIRED (env override: BACKENDS_JSON, a JSON list; env wins and
# replaces this list entirely). Each entry needs a unique non-empty `name`
# (your mnemonic — use it to know which model you are configuring), a `host`,
# and a `port`. `models:` is OPTIONAL — the served model ids (as exposed by
# the backend's /v1/models, which also labels its vllm:kv_cache_usage_perc
# series). Omit (or leave empty) to auto-adopt whatever the backend serves;
# when present and non-empty it WINS over discovery.
# A model id MAY be listed by more than one backend (duplicate model ids are
# LEGAL — the `routing:` section below decides which one gets a request;
# without a routing entry, a multi-owner model defaults to round_robin).
# Only duplicate ids WITHIN one backend's `models:` list are an error.
# At most one backend may be `default: true` (the fallback for unknown
# models; the first backend when none is flagged). All per-backend knobs are
# optional and default to the global values below.
backends:
  - name: qwen
    host: vllm-qwen
    port: 8000
    models: [qwen3-32b]        # mnemonic + validation anchor (optional)
    default: true
    # Per-backend overrides (all optional — the globals below are the
    # defaults; an omitted key inherits the global value):
    # thresholds:
    #   - kv_pct: 80
    #     max_context: 8192
    #     timeout_s: 30
    # target_kv_cache_pct: 80.0
    # token_margin: 1.5
    # retry_min_s: 10
    # retry_max_s: 120
  - name: qwen-fast
    host: vllm-qwen-fast
    port: 8001
    models: [qwen3-32b]        # same model id as 'qwen' above (legal)
    target_kv_cache_pct: 70.0  # fill it less: smaller effective KV headroom
  - name: llama
    host: vllm-llama
    port: 8002
    # no models: => auto-adopt from /v1/models; no overrides => global policy

# Routing — OPTIONAL. Only needed for model ids served by 2+ backends;
# file-only (there is no env override — BACKENDS_JSON/THRESHOLDS_JSON and the
# knob env vars are unchanged). Omitted or {} is valid. order is BOTH the
# candidate order and the failover order (first entry tried first; on a
# pre-stream transport failure / 5xx / 429 the next candidate is tried). A
# backend named in order that does not serve the model is a dead candidate
# the walk skips (each poller warns once per (model, backend) pair — logged,
# not fatal). policy is one of:
#   round_robin      — cycle candidates evenly (stateful, per model).
#   primary_fallback — always prefer order[0]; fall back in order.
#   large_small      — ctx >= threshold_tokens -> order[0] ("large"),
#                      otherwise the remaining candidates in order.
#   even             — route to the candidate that keeps all candidates'
#                      projected KV-cache % closest together (spread
#                      minimization — NOT greedy least-loaded).
#   fill             — fill order[0] up to its target_kv_cache_pct, then
#                      order[1], ...; 429 when every candidate is full.
#                      (≈ primary_fallback on outcomes — see README.)
# threshold_tokens (integer >= 1) is REQUIRED iff policy is large_small.
# A model with multiple owners and NO entry here defaults to round_robin
# over its candidates in config order.
routing:
  qwen3-32b:
    policy: fill
    order: [qwen, qwen-fast]
  # Alternative shapes (commented):
  # some-model:
  #   policy: large_small
  #   order: [big-box, small-box]
  #   threshold_tokens: 8000   # required for large_small only
  # other-model:
  #   policy: even
  #   order: [a, b, c]

# Where the gate listens.
# (env overrides: LISTEN_HOST, LISTEN_PORT)
listen_host: 0.0.0.0
listen_port: 8000

# How often each backend's /metrics is polled (one poller per backend, one
# GET per tick).
metrics_poll_interval_s: 2.0
# Age after which a backend's cached value is treated as unknown (fail-open
# for that backend).
stale_after_s: 6.0
# How often each backend's GET /v1/models is re-fetched (model discovery; the
# first fetch is immediate). (env override: MODEL_REFRESH_INTERVAL_S)
model_refresh_interval_s: 30.0

# Token estimation (global — not per-backend).
chars_per_token: 4
default_max_tokens: 256

# Global default tiered policy — OPTIONAL (env override: THRESHOLDS_JSON, a
# JSON list). A backend may override this per-backend. Highest tier only:
# when usage crosses several thresholds the one with the largest kv_pct
# governs. With no tiers the tiered layer always allows; the always-on
# autoconfig layer still gates every request.
thresholds:
  - kv_pct: 50
    max_context: 4096
    timeout_s: 15
  - kv_pct: 80
    max_context: 1024
    timeout_s: 30

# Global defaults for the autoconfig (always on) knobs — all optional,
# defaults shown. A backend may override any of them per-backend.
# target_kv_cache_pct: target KV-cache percentage (0-100) the remaining-KV
#   counter anchors headroom up to. Finite, (0, 100].
#   (env override: TARGET_KV_CACHE_PCT)
target_kv_cache_pct: 85.0
# retry_min_s / retry_max_s: bounds on the autoconfig 429 Retry-After (seconds).
#   retry_min_s >= 1; retry_max_s >= retry_min_s.
#   (env overrides: RETRY_MIN_S, RETRY_MAX_S)
retry_min_s: 5
retry_max_s: 60
# token_margin: conservatism multiplier on the estimated context tokens.
#   Finite, >= 1.0. (env override: TOKEN_MARGIN)
token_margin: 1.25
